name: magician-gate

# The plugin's own quality gate. The offline tiers run on every push and PR — they are
# dependency-free (stdlib unittest only), deterministic, and need no secrets or network. The
# runner has no `claude` CLI, so gate.sh skips the validator tier here with a note.
# The behavioral eval tier (claude plugin eval --trust-plugin) spends API budget, so the
# maintainer runs it locally before a release: bash scripts/gate.sh --evals --threshold 0.8

on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main, "release/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run offline gates
        run: bash scripts/gate.sh

  # Builds the Codex / ChatGPT package from this tree and validates it (frontmatter keys, description
  # length, links, plugin variables, JSON; `codex plugin validate` when the CLI is present). Nothing
  # is published.
  codex-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and validate the Codex package
        run: bash scripts/build-codex.sh --out "$RUNNER_TEMP/codex/magician"
      - name: Run the Codex build tests
        run: python3 -m unittest discover -s tests/claude -p 'test_codex_build.py'
