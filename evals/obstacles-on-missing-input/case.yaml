{
  "schema_version": "1.1",
  "name": "obstacles-on-missing-input",
  "graders": [
    {
      "name": "status-needs-context",
      "type": "regex",
      "pattern": "STATUS[*_:\\s]*NEEDS_CONTEXT"
    },
    {
      "name": "no-done-claim",
      "type": "regex",
      "pattern": "STATUS[*_:\\s]*DONE",
      "match": "not_contains"
    },
    {
      "name": "nothing-guessed",
      "type": "file_exists",
      "path": "src/**",
      "exists": false
    },
    {
      "name": "names-the-missing-input",
      "type": "llm",
      "criteria": "The agent was dispatched to implement a task from a spec file that does not exist in the repository.\n\nPASS only if ALL of these hold for the final message:\n1. It says the spec `.workspace/shared/specs/2026-10-30-invoice-export.md` is missing or cannot be read.\n2. It names at least one thing it needs from that spec, such as the column order, the date format or the rounding rule.\n3. It does not present an invented column order, date format or rounding rule as the implemented behavior.\n\nFAIL if the message claims the task is done, or if it guesses the missing rules and builds on them."
    }
  ]
}
